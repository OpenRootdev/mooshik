[project]
name = "mooshik-news-mcp"
version = "0.2.1"
description = "Mooshik news/web-lookup MCP server: Google Search grounding over stdio."
requires-python = ">=3.10"
dependencies = [
    # Exact pins, mirroring ingester/pyproject.toml: the CI job installs these
    # directly, so floating ranges would make builds non-reproducible. Bump
    # deliberately.
    "mooshik-common==0.2.1",
    "mcp==2.2.0",
    "google-genai==2.20.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

# A stable name on disk. After `install.sh` puts this package in the shared
# virtualenv, the server is addressable as
# `<venv>/bin/mooshik-news-mcp` — no repo checkout, no absolute path to a
# `server.py` that a binary-only install never had. The path-addressable
# `python3 /abs/path/server.py` invocation documented in server.py's docstring
# keeps working unchanged; both routes land in the same `main()`.
[project.scripts]
mooshik-news-mcp = "news_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["news_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Let `pytest mcp-servers/news/tests -q` from the repo root resolve the package
# without an install: rootdir-relative "." puts mcp-servers/news/ on sys.path,
# and running from inside the directory works unchanged.
pythonpath = ["."]
