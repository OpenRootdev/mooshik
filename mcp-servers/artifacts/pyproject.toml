[project]
name = "mooshik-artifacts-mcp"
version = "0.2.1"
description = "Mooshik artifacts MCP server: non-text workspace artifact extraction."
requires-python = ">=3.10"
dependencies = [
    "mooshik-common==0.2.1",
    "mcp==2.2.0",
    "google-genai==2.20.0",
    "google-adk==2.7.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

# See mcp-servers/news/pyproject.toml: a stable executable name inside the
# installed virtualenv, alongside the unchanged `python3 .../server.py` route.
[project.scripts]
mooshik-artifacts-mcp = "artifacts_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["artifacts_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
